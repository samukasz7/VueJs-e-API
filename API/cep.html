<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
</head>
<body>

    <h1>Cadastro</h1>

    <form>
        CEP: <input type="text" id="cep" required>
        <button type="button" onclick="buscar()">Buscar endereço</button>

        <br><br>

        Endereço: <input type="text" id="endereco" required>
        <br><br>

        Número: <input type="text" id="numero" required>
        <br><br>

        Complemento: <input type="text" id="complemento">
        <br><br>

        Bairro: <input type="text" id="bairro" required>
        <br><br>

        Cidade: <input type="text" id="cidade" required>
        <br><br>

        Estado: <input type="text" id="estado" required>
        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <script>
        function buscar() {

    let cep = document.getElementById('cep').value

    fetch('https://viacep.com.br/ws/' + cep + '/json/')
    .then(resposta => resposta.json())
    .then(dados => {

        document.getElementById('endereco').value = dados.logradouro
        document.getElementById('bairro').value = dados.bairro
        document.getElementById('cidade').value = dados.localidade
        document.getElementById('estado').value = dados.uf

    })

}
    </script>




</body>
</html>
